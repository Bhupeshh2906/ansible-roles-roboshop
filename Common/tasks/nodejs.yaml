- name: "Disable nodejs"
  ansible.builtin.command:
   dnf module disable nodejs -y

- name: "Enable nodejs"
  ansible.builtin.command:
    dnf module enable nodejs:20 -y

- name: "install nodejs"
  ansible.builtin.dnf:
    name: "nodejs"
    state: "present"

- name: "install dependency"
  ansible.general.npm:
    path: /app
  ignore_errors: true
